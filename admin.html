<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Urban Store PK — Admin Panel</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#111827;
}

header{
  background:#0f172a;
  color:#fff;
  padding:18px 5%;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:24px;
  font-weight:800;
}

.logout{
  background:#ef4444;
  color:#fff;
  border:0;
  padding:10px 15px;
  border-radius:7px;
  cursor:pointer;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:30px 20px;
}

.card{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:12px;
  padding:22px;
  margin-bottom:25px;
}

h2{margin-top:0}

input,textarea{
  width:100%;
  padding:11px;
  margin:6px 0 12px;
  border:1px solid #cbd5e1;
  border-radius:7px;
}

button{
  border:0;
  border-radius:7px;
  padding:11px 16px;
  cursor:pointer;
  font-weight:700;
}

.primary{
  background:#10b981;
  color:#fff;
}

.danger{
  background:#ef4444;
  color:#fff;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  padding:12px;
  border-bottom:1px solid #e5e7eb;
  text-align:left;
  vertical-align:middle;
}

.product-image{
  width:75px;
  height:65px;
  object-fit:cover;
  border-radius:8px;
  cursor:pointer;
  border:1px solid #ddd;
  transition:.2s;
}

.product-image:hover{
  transform:scale(1.05);
}

.login{
  max-width:420px;
  margin:80px auto;
}

.hidden{
  display:none;
}

.msg{
  margin-top:10px;
  color:#475569;
}

.profit{
  font-weight:800;
  color:#10b981;
}

.upload-label{
  display:inline-block;
  background:#2563eb;
  color:#fff;
  padding:11px 16px;
  border-radius:7px;
  cursor:pointer;
  font-weight:700;
}

#imageFiles{
  display:none;
}

.upload-status{
  margin-top:10px;
  color:#475569;
}

.preview-grid{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:12px;
}

.preview-item{
  width:110px;
  height:100px;
  border:1px solid #ddd;
  border-radius:8px;
  overflow:hidden;
}

.preview-item img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* GALLERY */

.gallery-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.88);
  z-index:9999;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.gallery-overlay.show{
  display:flex;
}

.gallery-box{
  width:min(900px,100%);
  text-align:center;
  position:relative;
}

.gallery-main{
  max-width:100%;
  max-height:65vh;
  object-fit:contain;
  border-radius:10px;
}

.gallery-title{
  color:#fff;
  font-size:21px;
  font-weight:700;
  margin-bottom:15px;
}

.gallery-close{
  position:fixed;
  top:18px;
  right:20px;
  width:45px;
  height:45px;
  border-radius:50%;
  background:#ef4444;
  color:#fff;
  font-size:25px;
  padding:0;
  z-index:10001;
}

.gallery-arrow{
  position:fixed;
  top:50%;
  transform:translateY(-50%);
  width:48px;
  height:48px;
  border-radius:50%;
  background:#fff;
  color:#111;
  font-size:30px;
  padding:0;
  z-index:10001;
}

.gallery-prev{
  left:20px;
}

.gallery-next{
  right:20px;
}

.gallery-thumbnails{
  display:flex;
  justify-content:center;
  gap:8px;
  flex-wrap:wrap;
  margin-top:15px;
}

.gallery-thumb{
  width:65px;
  height:55px;
  object-fit:cover;
  border-radius:6px;
  cursor:pointer;
  border:2px solid transparent;
}

.gallery-thumb.active{
  border-color:#10b981;
}

.picture-count{
  font-size:12px;
  color:#64748b;
}

@media(max-width:600px){

  header{
    padding:15px;
  }

  .logo{
    font-size:18px;
  }

  .container{
    padding:20px 10px;
  }

  .gallery-main{
    max-height:55vh;
  }

  .gallery-prev{
    left:8px;
  }

  .gallery-next{
    right:8px;
  }

  .gallery-arrow{
    width:42px;
    height:42px;
  }

}
</style>
</head>

<body>

<header>
  <div class="logo">Urban Store PK — Admin</div>
  <button class="logout" id="logoutBtn">Logout</button>
</header>

<div class="container">

<div id="loginBox" class="card login">

<h2>Admin Login</h2>

<input
id="email"
type="email"
placeholder="Admin Email">

<input
id="password"
type="password"
placeholder="Password">

<button
class="primary"
id="loginBtn">
Login
</button>

<div id="loginMsg" class="msg"></div>

</div>


<div id="adminPanel" class="hidden">

<div class="card">

<h2>Add New Product</h2>

<label>Product Name</label>

<input
id="productName"
placeholder="e.g. Premium Leather Wallet">


<label>Description</label>

<textarea
id="productDescription"
placeholder="Product description"></textarea>


<label>Cost Price</label>

<input
id="costPrice"
type="number"
placeholder="e.g. 795">


<label>Selling Price</label>

<input
id="sellingPrice"
type="number"
placeholder="e.g. 999">


<label>Product Pictures (Maximum 5)</label>

<br><br>

<label
for="imageFiles"
class="upload-label">

📷 Choose Product Pictures

</label>

<input
id="imageFiles"
type="file"
accept="image/*"
multiple>

<div
id="uploadStatus"
class="upload-status">

No pictures selected

</div>

<div
id="imagePreview"
class="preview-grid">
</div>

<div
id="profitPreview"
class="profit">

Profit: Rs. 0

</div>

<br>

<button
class="primary"
id="addProductBtn">

Add Product

</button>

<div
id="productMsg"
class="msg">
</div>

</div>


<div class="card">

<h2>Products</h2>

<div style="overflow-x:auto">

<table>

<thead>

<tr>
<th>Image</th>
<th>Product</th>
<th>Cost</th>
<th>Selling</th>
<th>Profit</th>
<th>Action</th>
</tr>

</thead>

<tbody id="productsTable"></tbody>

</table>

</div>

</div>


<div class="card">

<h2>Orders</h2>

<div style="overflow-x:auto">

<table>

<thead>

<tr>
<th>Customer</th>
<th>Phone</th>
<th>Address</th>
<th>Total</th>
<th>Status</th>
</tr>

</thead>

<tbody id="ordersTable"></tbody>

</table>

</div>

</div>

</div>

</div>


<!-- PRODUCT GALLERY -->

<div
id="galleryOverlay"
class="gallery-overlay">

<button
id="galleryClose"
class="gallery-close">

×
</button>

<button
id="galleryPrev"
class="gallery-arrow gallery-prev">

‹
</button>

<div class="gallery-box">

<div
id="galleryTitle"
class="gallery-title">
</div>

<img
id="galleryMain"
class="gallery-main"
src=""
alt="Product">

<div
id="galleryThumbnails"
class="gallery-thumbnails">
</div>

</div>

<button
id="galleryNext"
class="gallery-arrow gallery-next">

›
</button>

</div>
<script type="module">

import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


const SUPABASE_URL =
"https://tthkmezmyvnjufnrbezp.supabase.co";


const SUPABASE_KEY =
"sb_publishable_Pi3JraUChkZ_f5xGukdrlQ_f4Vzvhqw";


const supabase =
createClient(
SUPABASE_URL,
SUPABASE_KEY
);


const loginBox =
document.getElementById("loginBox");

const adminPanel =
document.getElementById("adminPanel");

const loginMsg =
document.getElementById("loginMsg");


async function checkLogin(){

const {data} =
await supabase.auth.getSession();

if(data.session){

loginBox.classList.add("hidden");

adminPanel.classList.remove("hidden");

loadProducts();
loadOrders();

}else{

loginBox.classList.remove("hidden");

adminPanel.classList.add("hidden");

}

}


document
.getElementById("loginBtn")
.addEventListener("click",async()=>{

const email =
document
.getElementById("email")
.value
.trim();

const password =
document
.getElementById("password")
.value;


if(!email || !password){

loginMsg.textContent =
"Email aur password enter karein.";

return;

}


loginMsg.textContent =
"Logging in...";


const {error} =
await supabase.auth.signInWithPassword({

email,
password

});


if(error){

loginMsg.textContent =
"Login failed: " +
error.message;

return;

}


checkLogin();

});


document
.getElementById("logoutBtn")
.addEventListener("click",async()=>{

await supabase.auth.signOut();

checkLogin();

});


const costInput =
document.getElementById("costPrice");

const sellingInput =
document.getElementById("sellingPrice");


function calculateProfit(){

const cost =
Number(costInput.value) || 0;

const selling =
Number(sellingInput.value) || 0;

const profit =
selling-cost;


document
.getElementById("profitPreview")
.textContent =
"Profit: Rs. " +
profit.toLocaleString();

}


costInput.addEventListener(
"input",
calculateProfit
);

sellingInput.addEventListener(
"input",
calculateProfit
);


const imageFiles =
document.getElementById("imageFiles");

const imagePreview =
document.getElementById("imagePreview");

const uploadStatus =
document.getElementById("uploadStatus");


imageFiles.addEventListener(
"change",
()=>{

const files =
Array.from(imageFiles.files);


imagePreview.innerHTML="";


if(files.length===0){

uploadStatus.textContent =
"No pictures selected";

return;

}


if(files.length>5){

alert(
"Maximum 5 pictures select karein."
);

imageFiles.value="";

uploadStatus.textContent =
"Maximum 5 pictures allowed";

return;

}


uploadStatus.textContent =
files.length +
" picture(s) selected";


files.forEach(file=>{

const url =
URL.createObjectURL(file);


const div =
document.createElement("div");

div.className =
"preview-item";


const img =
document.createElement("img");

img.src=url;

div.appendChild(img);

imagePreview.appendChild(div);

});

});


document
.getElementById("addProductBtn")
.addEventListener("click",async()=>{

const name =
document
.getElementById("productName")
.value
.trim();


const description =
document
.getElementById("productDescription")
.value
.trim();


const cost =
Number(costInput.value);


const price =
Number(sellingInput.value);


const files =
Array.from(imageFiles.files);


const msg =
document
.getElementById("productMsg");


if(!name || !cost || !price){

msg.textContent =
"Product name, cost price aur selling price zaroori hain.";

return;

}


if(files.length>5){

msg.textContent =
"Maximum 5 pictures allowed hain.";

return;

}


msg.textContent =
"Product add ho raha hai...";


const image_urls=[];


if(files.length>0){

uploadStatus.textContent =
"Pictures uploading...";


for(
let i=0;
i<files.length;
i++
){

const file =
files[i];


const fileExt =
file.name
.split(".")
.pop();


const fileName =
Date.now()+
"-"+
i+
"-"+
Math.random()
.toString(36)
.substring(2)+
"."+
fileExt;


const {error:uploadError} =
await supabase.storage
.from("product-images")
.upload(
fileName,
file
);


if(uploadError){

msg.textContent =
"Picture upload failed: "+
uploadError.message;

return;

}


const {data:publicData} =
supabase.storage
.from("product-images")
.getPublicUrl(
fileName
);


image_urls.push(
publicData.publicUrl
);

}

}


const {error} =
await supabase
.from("products")
.insert([{

name:name,

description:description,

cost_price:cost,

price:price,

image_url:
image_urls[0] || "",

image_urls:image_urls

}]);


if(error){

msg.textContent =
"Product add nahi hua: "+
error.message;

return;

}


msg.textContent =
"Product successfully add ho gaya with "+
image_urls.length+
" picture(s).";


document
.getElementById("productName")
.value="";


document
.getElementById("productDescription")
.value="";


costInput.value="";

sellingInput.value="";

imageFiles.value="";

imagePreview.innerHTML="";

uploadStatus.textContent =
"No pictures selected";


calculateProfit();

loadProducts();

});


/* GALLERY VARIABLES */

let galleryImages=[];

let galleryIndex=0;


const galleryOverlay =
document.getElementById(
"galleryOverlay"
);

const galleryMain =
document.getElementById(
"galleryMain"
);

const galleryTitle =
document.getElementById(
"galleryTitle"
);

const galleryThumbnails =
document.getElementById(
"galleryThumbnails"
);


function getProductImages(product){

let images=[];


if(
Array.isArray(product.image_urls)
){

images =
product.image_urls
.filter(Boolean);

}


if(
images.length===0 &&
product.image_url
){

images=[
product.image_url
];

}


return [
...new Set(images)
];

}


function openGallery(
images,
title
){

if(!images.length){
return;
}


galleryImages=images;

galleryIndex=0;

galleryTitle.textContent =
title || "Product";

galleryOverlay.classList.add(
"show"
);

renderGallery();

}


function renderGallery(){

if(!galleryImages.length){
return;
}


galleryMain.src =
galleryImages[galleryIndex];


galleryThumbnails.innerHTML="";


galleryImages.forEach(
(url,index)=>{

const img =
document.createElement("img");

img.src=url;

img.className =
"gallery-thumb";


if(index===galleryIndex){

img.classList.add("active");

}


img.addEventListener(
"click",
()=>{

galleryIndex=index;

renderGallery();

});


galleryThumbnails.appendChild(
img
);

});

}


function nextImage(){

if(!galleryImages.length){
return;
}


galleryIndex=
(
galleryIndex+1
)%galleryImages.length;


renderGallery();

}


function previousImage(){

if(!galleryImages.length){
return;
}


galleryIndex=
(
galleryIndex-1+
galleryImages.length
)%galleryImages.length;


renderGallery();

}


document
.getElementById("galleryNext")
.addEventListener(
"click",
nextImage
);


document
.getElementById("galleryPrev")
.addEventListener(
"click",
previousImage
);


document
.getElementById("galleryClose")
.addEventListener(
"click",
()=>{

galleryOverlay.classList.remove(
"show"
);

});


galleryOverlay.addEventListener(
"click",
event=>{

if(
event.target===
galleryOverlay
){

galleryOverlay.classList.remove(
"show"
);

}

});


document.addEventListener(
"keydown",
event=>{

if(
!galleryOverlay.classList.contains(
"show"
)
){

return;

}


if(event.key==="Escape"){

galleryOverlay.classList.remove(
"show"
);

}


if(event.key==="ArrowRight"){

nextImage();

}


if(event.key==="ArrowLeft"){

previousImage();

}

});
  async function loadProducts(){

const {data,error} =
await supabase
.from("products")
.select("*")
.order(
"id",
{ascending:false}
);


const table =
document
.getElementById("productsTable");


if(error){

table.innerHTML=
`
<tr>
<td colspan="6">
${error.message}
</td>
</tr>
`;

return;

}


table.innerHTML =
(data || [])
.map(product=>{

const images =
getProductImages(product);


const firstImage =
images[0];


const pictureCount =
images.length;


const profit =
Number(product.price)-
Number(
product.cost_price || 0
);


return `

<tr>

<td>

${
firstImage

?

`
<img
class="product-image"
src="${firstImage}"
alt="${product.name}"
data-product-id="${product.id}"
title="Click to view all pictures">
`

:

"📦"

}

<br>

<small class="picture-count">

${
pictureCount
}

picture(s)

</small>

</td>


<td>

${product.name || ""}

</td>


<td>

Rs.
${Number(
product.cost_price || 0
).toLocaleString()}

</td>


<td>

Rs.
${Number(
product.price || 0
).toLocaleString()}

</td>


<td class="profit">

Rs.
${profit.toLocaleString()}

</td>


<td>

<button
class="danger delete-product"
data-id="${product.id}">

Delete

</button>

</td>

</tr>

`;

})
.join("");


/* CLICK IMAGE TO OPEN GALLERY */

(data || []).forEach(product=>{

const image =
document.querySelector(
`[data-product-id="${product.id}"]`
);


if(image){

image.addEventListener(
"click",
()=>{

openGallery(
getProductImages(product),
product.name
);

});

}


const deleteButton =
document.querySelector(
`.delete-product[data-id="${product.id}"]`
);


if(deleteButton){

deleteButton.addEventListener(
"click",
()=>{

deleteProduct(product.id);

});

}

});

}


async function deleteProduct(id){

if(
!confirm(
"Kya aap ye product delete karna chahte hain?"
)
){

return;

}


const {error} =
await supabase
.from("products")
.delete()
.eq("id",id);


if(error){

alert(
"Delete failed: "+
error.message
);

return;

}


loadProducts();

}


async function loadOrders(){

const {data,error} =
await supabase
.from("orders")
.select("*")
.order(
"id",
{ascending:false}
);


const table =
document
.getElementById("ordersTable");


if(error){

table.innerHTML=
`
<tr>
<td colspan="5">
${error.message}
</td>
</tr>
`;

return;

}


table.innerHTML =
(data || [])
.map(order=>{

return `

<tr>

<td>
${order.customer_name || ""}
</td>

<td>
${order.phone || ""}
</td>

<td>
${order.address || ""}
</td>

<td>
Rs.
${Number(
order.total || 0
).toLocaleString()}
</td>

<td>
${order.status || "New"}
</td>

</tr>

`;

})
.join("");

}


checkLogin();

</script>

</body>
</html>
